<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Counter-App</title>

    <link rel="icon" href="assets/favicons/favicon.png" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicons/CounterApp-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicons/apple-touch-icon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <div class="app">
      <div class="screen">
        
        <div class="island"></div>
        <div class="statusbar">
          <span id="uhr">09:41</span>
          <span>📶 🔋</span>
        </div>

        <div class="main-header"> 
          <h1 id="headerTitle">Counter-App</h1>
          <button id="addCounterBtn" class="circle-btn">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>

        <div class="content">
          
          <div id="mainView">
            <div class="input-group">
              <input type="text" id="CounterInput" placeholder="Name eingeben..." />
            </div>
            <div id="CounterContainer"></div>
          </div>

          <div id="CounterView" class="hidden">
            <div class="counter-box">
              <span id="CounterValue">0</span>
            </div>

            <div class="counter-buttons">
              <button id="minusBtn" class="counter-action-btn danger-btn">-</button>
              <button id="resetBtn" class="counter-action-btn warning-btn">Reset</button>
              <button id="plusBtn" class="counter-action-btn success-btn">+</button>
            </div>

            <div class="update-box">
              <p>Letztes Update: <span id="lastUpdated">Noch nicht aktualisiert</span></p>
            </div>
          </div>

          <div id="settingsView" class="hidden">
            <div class="settings-card">
              <h3><i class="fa-solid fa-rotate"></i> Reset-Einstellungen</h3>
              
              <div class="settings-group">
                <label for="settingsCounterSelect">Counter wählen:</label>
                <select id="settingsCounterSelect" class="styled-select">
                  <option value="">-- Kein Counter vorhanden --</option>
                </select>
              </div>

              <div class="settings-group checkbox-group">
                <input type="checkbox" id="enableResetCheckbox" checked>
                <label for="enableResetCheckbox">Täglicher Reset aktiviert</label>

                <div class="tooltip-container">
                  <i class="fa-solid fa-circle-info info-icon"></i>
                  <span class="tooltip-text">Der Reset erfolgt automatisch um 00:00 Uhr Mitternacht, sobald der Counter am nächsten Tag das erste Mal geöffnet wird.</span>
                </div>

              </div>
            </div>
          </div>

        </div>

        <div class="navbar">
          <button id="homeBtn" class="nav-btn">
            <i class="fa-solid fa-list-ul"></i>
            <span>Übersicht</span>
          </button>
          <button id="counterBtn" class="nav-btn">
            <i class="fa-solid fa-stopwatch"></i>
            <span>Counter</span>
          </button>
          <button id="settingsBtn" class="nav-btn">
            <i class="fa-solid fa-gear"></i>
            <span>Optionen</span>
          </button>
        </div>

      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
